apiVersion: v1
kind: ConfigMap
metadata:
  name: pdp-policy-config
  namespace: workloads
data:
  policy.yaml: |
    # Trust-Aware Dataplane - Policy Rules
    # Format: caller -> target mappings with allowed principals
    rules:
      # Only chat-agent and summary-agent can call read-agent
      - caller: "agent:chat-agent"
        target: "agent:read-agent"
        action: allow
      - caller: "agent:summary-agent"
        target: "agent:read-agent"
        action: allow
      # Only chat-agent can call sales-agent
      - caller: "agent:chat-agent"
        target: "agent:sales-agent"
        action: allow
      # Only chat-agent can call summary-agent
      - caller: "agent:chat-agent"
        target: "agent:summary-agent"
        action: allow
      # Agents can access mock-database
      - caller: "agent:read-agent"
        target: "resource:mock-database"
        action: allow
      - caller: "agent:sales-agent"
        target: "resource:mock-database"
        action: allow
      # Principals can reach chat-agent
      - caller_type: "principal"
        target: "agent:chat-agent"
        action: allow

    # Default action when no rule matches
    default: deny
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdp-config
  namespace: workloads
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import yaml
    import os

    POLICY_PATH = os.environ.get("POLICY_PATH", "/etc/policy/policy.yaml")

    def load_policy():
        with open(POLICY_PATH) as f:
            return yaml.safe_load(f)

    policy = load_policy()

    def evaluate(caller_id, caller_type, target, principal_id):
        """Evaluate policy rules. Returns (allowed, reason)."""
        for rule in policy.get("rules", []):
            # Match by caller_type (e.g., any principal)
            if "caller_type" in rule:
                if caller_type == rule["caller_type"] and target == rule["target"]:
                    return (rule["action"] == "allow",
                            f"matched rule: caller_type={rule['caller_type']} -> {rule['target']}")

            # Match by caller identity
            if "caller" in rule:
                if caller_id == rule["caller"] and target == rule["target"]:
                    return (rule["action"] == "allow",
                            f"matched rule: {rule['caller']} -> {rule['target']}")

        default = policy.get("default", "deny")
        return (default == "allow", f"no matching rule, default={default}")

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/policy/rules":
                self._send_rules()
            else:
                self._check()

        def do_POST(self):
            if self.path == "/policy/test":
                self._test()
            else:
                self._check()

        def do_HEAD(self):
            self._check()

        def do_OPTIONS(self):
            self.send_response(200)
            self._cors_headers()
            self.end_headers()

        def _cors_headers(self):
            self.send_header("Access-Control-Allow-Origin", "*")
            self.send_header("Access-Control-Allow-Methods", "GET, POST, OPTIONS")
            self.send_header("Access-Control-Allow-Headers", "Content-Type")

        def _send_rules(self):
            """Return current policy rules for display."""
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self._cors_headers()
            self.end_headers()
            self.wfile.write(json.dumps(policy).encode())

        def _test(self):
            """Test endpoint for dashboard: accepts JSON body with caller, target, etc."""
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length)) if length else {}

            caller_id = body.get("caller_id", "unknown")
            caller_type = body.get("caller_type", "unknown")
            target = body.get("target", "unknown")
            principal_id = body.get("principal_id", "unknown")

            allowed, reason = evaluate(caller_id, caller_type, target, principal_id)

            print(f"[pdp] TEST caller={caller_id} type={caller_type} target={target} "
                  f"principal={principal_id} -> {'ALLOW' if allowed else 'DENY'} ({reason})")

            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self._cors_headers()
            self.end_headers()
            self.wfile.write(json.dumps({
                "allowed": allowed,
                "reason": reason,
                "caller": caller_id,
                "target": target,
                "principal": principal_id
            }).encode())

        def _check(self):
            """Envoy ext_authz: evaluate from request headers."""
            caller_id = self.headers.get("x-caller-id", "unknown")
            caller_type = self.headers.get("x-caller-type", "unknown")
            target = self.headers.get("x-trust-target", "unknown")
            principal_id = self.headers.get("x-principal-id", "unknown")

            allowed, reason = evaluate(caller_id, caller_type, target, principal_id)

            print(f"[pdp] caller={caller_id} type={caller_type} target={target} "
                  f"principal={principal_id} -> {'ALLOW' if allowed else 'DENY'} ({reason})")

            if allowed:
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"allowed": True, "reason": reason}).encode())
            else:
                self.send_response(403)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({
                    "allowed": False,
                    "reason": reason,
                    "caller": caller_id,
                    "target": target
                }).encode())

        def log_message(self, format, *args):
            pass  # suppress default logging, we log in _check

    print(f"[pdp] Loaded policy with {len(policy.get('rules', []))} rules, default={policy.get('default', 'deny')}")
    print(f"[pdp] Starting PDP on port 8080")
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-decision-service
  namespace: workloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-decision-service
  template:
    metadata:
      labels:
        app: policy-decision-service
    spec:
      containers:
        - name: pdp
          image: python:3.11-slim
          command: ["sh", "-c", "pip install pyyaml -q && python -u /app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app
            - name: policy
              mountPath: /etc/policy
      volumes:
        - name: config
          configMap:
            name: pdp-config
        - name: policy
          configMap:
            name: pdp-policy-config
---
apiVersion: v1
kind: Service
metadata:
  name: policy-decision-service
  namespace: workloads
spec:
  selector:
    app: policy-decision-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
